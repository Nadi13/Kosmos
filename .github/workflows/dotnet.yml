name: .Net 6 CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    name: CI Build
    defaults:
      run:
        working-directory: ShipGame
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 6.0.x

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test ./Tests/ --collect:"XPlat Code Coverage" --settings ./coverlet.runsettings --results-directory ./Tests/coverage

    - name: Generate Code Coverage Report
      run: |
        mkdir -p ./Tests/coverage/report
        dotnet tool install --global coverlet.console
        coverlet ./Tests/bin/Release/net6.0/Tests.dll --target 'dotnet' --targetargs 'test --no-build --verbosity normal' --format cobertura --output ./Tests/coverage/report/coverage.cobertura.xml

    - name: Code Coverage Summary
      run: |
        echo "## Code Coverage Summary" > code-coverage-results.md
        echo "" >> code-coverage-results.md
        echo "Coverage Report:" >> code-coverage-results.md
        echo "" >> code-coverage-results.md
        reportgenerator -reports:./Tests/coverage/report/coverage.cobertura.xml -targetdir:./Tests/coverage/report/html -reporttypes:Html
        echo "Coverage report generated at ./Tests/coverage/report/html/index.html"

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md