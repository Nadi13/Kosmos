name: .Net 6 CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    name: CI Build
    defaults:
      run:
        working-directory: ShipGame
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 6.0.x

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test ./Tests/ --collect:"XPlat Code Coverage" --settings ./coverlet.runsettings --results-directory ./coverage

    - name: List coverage directory
      run: ls -l ./coverage

    - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          badge: true
          format: markdown
          output: both
          fail_below_min: false
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          thresholds: 50 75
        env:
          DOTNET_ROOT: /home/runner/.dotnet
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm -v ${{ github.workspace }}/coverage:/coverage ghcr.io/irongut/codecoveragesummary:v1.3.0 --files /coverage/**/*.cobertura.xml --badge true --fail false --format markdown --hidebranch false --hidecomplexity false --indicators true --output both --thresholds 50 75

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md