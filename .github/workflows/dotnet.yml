name: .Net 6 CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    name: CI Build
    defaults:
      run:
        working-directory: ShipGame
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 6.0.x

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test ./Tests/ --collect:"XPlat Code Coverage" --settings ./coverlet.runsettings --verbosity normal --results-directory ./coverage

    - name: Find coverage file
      run: find ./coverage/** -name "*.xml" -exec mv {} ./coverage/**/coverage.opencover.xml \;

    - name: Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: './coverage/5a3983fe-17f3-428d-af1d-f5cc5cbdd9b2/coverage.opencover.xml'
        badge: true
        format: 'markdown'
        output: 'both'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md